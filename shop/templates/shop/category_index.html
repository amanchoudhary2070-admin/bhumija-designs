{% extends "shop/base.html" %}
{% load icons %}
{% block title %}All Categories - {{ SHOP_NAME }}{% endblock %}
{% block content %}
  <div class="wrap">
    <h1 class="page-title">Shop by Category</h1>
    <ul class="category-grid category-grid-large">
      {% for cat in categories %}
        <li>
          <a href="{{ cat.get_absolute_url }}">
            <span class="category-circle category-circle-lg">{% category_icon cat.icon_key 36 %}</span>
            <span>{{ cat.name }}</span>
          </a>
        </li>
      {% endfor %}
    </ul>
  </div>
{% endblock %}
